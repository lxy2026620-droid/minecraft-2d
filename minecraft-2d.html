<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D 我的世界 - 横版沙盒</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:"Microsoft YaHei","Segoe UI",sans-serif; user-select:none; }
  #game { display:block; cursor:crosshair; image-rendering:pixelated; }
  .slot { width:52px; height:52px; border:3px solid #373737; border-top-color:#5a5a5a; border-left-color:#5a5a5a; border-right-color:#2a2a2a; border-bottom-color:#1a1a1a; background:rgba(139,139,139,0.3); position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .slot:hover { border-color:#aaa; }
  .slot.selected { border:3px solid #fff; box-shadow:0 0 6px rgba(255,255,255,0.6); background:rgba(255,255,255,0.15); }
  .slot .icon { width:40px; height:40px; image-rendering:pixelated; }
  .slot .count { position:absolute; bottom:1px; right:4px; color:#fff; font-size:14px; font-weight:bold; text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000; pointer-events:none; }
  .slot .keybind { position:absolute; top:1px; left:4px; color:#ddd; font-size:10px; text-shadow:1px 1px 0 #000; pointer-events:none; }
  #hotbar { position:fixed; bottom:4px; left:50%; transform:translateX(-50%); display:flex; gap:2px; padding:3px 6px 4px; background:linear-gradient(#555,#222); border:2px solid #111; border-top:2px solid #777; z-index:10; }
  .panel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#c6c6c6; border:3px solid #1a1a1a; padding:14px; z-index:30; display:none; box-shadow:0 0 40px rgba(0,0,0,0.7),inset 0 0 0 3px #555; }
  .panel.open { display:block; }
  .panel .title { color:#444; font-size:14px; margin-bottom:8px; text-align:center; font-weight:bold; }
  .grid9 { display:grid; grid-template-columns:repeat(9,52px); gap:3px; }
  .divider { height:3px; background:linear-gradient(#888,#444); margin:6px 0 10px; }
  .recipe { display:flex; align-items:center; gap:10px; padding:6px 8px; margin-bottom:4px; background:rgba(0,0,0,0.3); border:1px solid #444; border-radius:3px; cursor:pointer; }
  .recipe:hover { background:rgba(255,255,255,0.12); border-color:#fff; }
  .recipe.disabled { opacity:0.4; cursor:not-allowed; }
  .recipe .r-out { width:36px; height:36px; image-rendering:pixelated; }
  .recipe .r-name { color:#fff; font-size:13px; flex:1; }
  .recipe .r-in { color:#bbb; font-size:11px; text-align:right; }
  .recipe .r-count { color:#ffe08a; font-weight:bold; margin-left:4px; }
  #cursorItem { position:fixed; pointer-events:none; z-index:100; display:none; width:40px; height:40px; }
  #cursorItem .icon { width:100%; height:100%; image-rendering:pixelated; }
  #cursorItem .count { position:absolute; bottom:-2px; right:0; color:#fff; font-size:13px; font-weight:bold; text-shadow:2px 2px 0 #000,-2px -2px 0 #000; }
  #hud { position:fixed; left:50%; transform:translateX(-50%); bottom:72px; z-index:9; display:flex; gap:30px; pointer-events:none; }
  #hud .row { display:flex; gap:2px; }
  .heart,.drumstick { width:18px; height:18px; image-rendering:pixelated; }
  #hint { position:fixed; top:8px; left:8px; color:#fff; font-size:12px; line-height:1.7; background:rgba(0,0,0,0.45); padding:8px 12px; border-radius:4px; z-index:10; pointer-events:none; }
  #hint b { color:#ffe08a; }
  #info { position:fixed; top:8px; right:8px; color:#fff; font-size:12px; line-height:1.7; background:rgba(0,0,0,0.45); padding:8px 12px; border-radius:4px; z-index:10; pointer-events:none; text-align:right; }
  #crosshair { position:fixed; pointer-events:none; z-index:5; width:18px; height:18px; transform:translate(-50%,-50%); }
  #crosshair::before,#crosshair::after { content:""; position:absolute; background:rgba(255,255,255,0.9); }
  #crosshair::before { left:8px; top:0; width:2px; height:18px; }
  #crosshair::after { top:8px; left:0; height:2px; width:18px; }
  /* 熔炉 */
  #furnace .furnace-grid { display:flex; gap:12px; align-items:center; justify-content:center; }
  #furnace .fcell { width:52px; height:52px; border:2px solid #555; background:rgba(40,40,40,0.6); position:relative; }
  #furnace .fcell .icon { width:40px; height:40px; margin:6px; image-rendering:pixelated; }
  #furnace .flame { color:#ff8030; font-size:20px; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#87CEEB; z-index:200; color:#fff; font-size:20px; flex-direction:column; }
  #loading .bar { width:240px; height:12px; border:2px solid #fff; margin-top:12px; border-radius:6px; overflow:hidden; }
  #loading .fill { height:100%; width:0%; background:#4caf50; transition:width .2s; }
  .hidden { display:none !important; }
  /* 手机端 */ @media (max-width:900px),(pointer:coarse){ #mobile{display:flex !important} #hint{display:none} #hotbar{bottom:56px} .slot{width:40px;height:40px} #hud{bottom:110px} }
  #mobile{display:none;position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-between;align-items:flex-end;padding:4px 8px 8px;pointer-events:none}
  #mobile>*{pointer-events:auto}
  #mdpad{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;gap:2px}
  .mbtn{width:50px;height:50px;border:2px solid rgba(255,255,255,0.4);background:rgba(0,0,0,0.35);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .mbtn:active{background:rgba(255,255,255,0.3)}
  #mleft{grid-column:1;grid-row:2}
  #mright{grid-column:3;grid-row:2}
  #mup{grid-column:2;grid-row:1}
  #mdown{grid-column:2;grid-row:3}
  #mjump{margin-bottom:10px}
  #mact{display:flex;gap:8px;margin-bottom:10px}
  #msetting{position:fixed;top:10px;right:10px;z-index:40;width:36px;height:36px;border:2px solid rgba(255,255,255,0.5);background:rgba(0,0,0,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer}
  #sp{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.92);border:2px solid #555;padding:18px;z-index:50;display:none;color:#fff;font-size:13px;min-width:220px;border-radius:6px}
  #sp.open{display:block}
  #sp label{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
  #sp input[type=range]{width:100px}
  /* 主菜单 */
  #menu{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(#3a6090 0%,#6a90c0 30%,#5a8840 70%,#4a6a30 85%,#5a5a3a 100%);overflow:hidden}
  #menu::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent,transparent 3px,rgba(0,0,0,0.06) 4px,rgba(0,0,0,0.06) 5px)}
  #menu h1{color:#fff;font-size:42px;text-shadow:3px 3px 0 #3a3a3a;margin-bottom:30px;z-index:1;letter-spacing:4px;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
  #menu h1 span{color:#ffd040}
  .menubtn{width:260px;padding:10px 0;margin:6px 0;border:3px solid #1a1a1a;border-top-color:#888;border-left-color:#888;border-right-color:#222;background:#7a7a7a;color:#fff;font-size:16px;text-align:center;cursor:pointer;position:relative;z-index:1;font-family:"Microsoft YaHei","Segoe UI",sans-serif;text-shadow:2px 2px 0 #3a3a3a}
  .menubtn:hover{background:#9a9a9a;border-top-color:#aaa;border-left-color:#aaa}
  #menu .ver{color:#aaa;font-size:11px;position:absolute;bottom:12px;z-index:1}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="crosshair"></div>
<div id="msetting" onclick="toggleSettings()">⚙</div>
<div id="sp"><b style="color:#ffe08a">游戏设置</b>
  <label>音效音量 <input type="range" min="0" max="100" id="sVol" oninput="applySet()"></label>
  <label>粒子密度 <input type="range" min="0" max="20" id="sPar" oninput="applySet()"></label>
  <label>夜晚亮度 <input type="range" min="5" max="60" id="sNight" oninput="applySet()"></label>
  <label>渲染距离 <input type="range" min="6" max="18" id="sDist" oninput="applySet()"></label>
  <label style="color:#aaa;font-size:11px">关闭: 点击⚙ 或 按Esc</label>
</div>
<div id="mobile">
  <div id="mdpad"><div class="mbtn" id="mup">▲</div><div class="mbtn" id="mleft">◀</div><div class="mbtn" id="mright">▶</div><div class="mbtn" id="mdown">▼</div></div>
  <div id="mact"><div class="mbtn" id="mbreak" style="font-size:14px">⛏</div><div class="mbtn" id="mplace" style="font-size:14px">🧱</div></div>
  <div><div class="mbtn" id="mjump" style="font-size:24px">⬆</div></div>
</div>
<div id="cursorItem"><canvas class="icon" width="40" height="40"></canvas><div class="count"></div></div>
<div id="hint">
  <b>操作</b> A/D 移动 · 空格 跳(长按更高) · 左键 破坏/攻击 · 右键 放置/使用<br>
  <b>物品</b> 1-9/滚轮 选格 · E 背包 · C 合成 · F 吃食物 · 右键熔炉/床使用<br>
  <b>战斗</b> 夜晚出僵尸 · 做床可睡觉跳过夜晚
</div>
<div id="info"></div>
<div id="hud"><div class="row" id="hearts"></div><div class="row" id="hunger"></div></div>
<div id="hotbar"></div>

<div class="panel" id="inventory">
  <div class="title">背包 — 左键交换 · 右键单个</div>
  <div class="grid9" id="invGrid"></div>
  <div class="divider"></div>
  <div class="grid9" id="invHotbar"></div>
</div>

<div class="panel" id="crafting">
  <div class="title">合成 (C 关闭)</div>
  <div id="recipeList"></div>
</div>

<div class="panel" id="furnace">
  <div class="title">熔炉 (Esc 关闭)</div>
  <div class="furnace-grid">
    <div class="fcell" id="furnIn"><canvas class="icon" width="40" height="40"></canvas><div class="count"></div></div>
    <div class="flame" id="furnFlame">🔥</div>
    <div class="fcell" id="furnFuel"><canvas class="icon" width="40" height="40"></canvas><div class="count"></div></div>
    <div class="flame">→</div>
    <div class="fcell" id="furnOut"><canvas class="icon" width="40" height="40"></canvas><div class="count"></div></div>
  </div>
  <div style="color:#aaa;font-size:11px;margin-top:8px;text-align:center;">左键放入/取出 · 煤炭/木板/原木可作燃料</div>
</div>

<div id="loading"><div>正在加载 Minecraft 纹理…</div><div class="bar"><div class="fill" id="loadFill"></div></div></div>
<div id="menu"><h1><span>MC</span> 2D</h1><div class="menubtn" onclick="startGame()">单人游戏</div><div class="menubtn" onclick="toggleSettings()">设置</div><div class="menubtn" onclick="window.open('https://github.com/lxy2026620-droid/minecraft-2d','_blank')">GitHub</div><span class="ver">v1.0 · 种子: <span id="menuSeed">---</span></span></div>

<script>

// ============================================================ 配置

  DAY_LEN: 18000,

// 物品定义。texUrl=true 表示有网络纹理(走TEX_URLS)。need=挖掘所需工具类型。

// ============================================================ 画布

const inventory=new Array(INV_SIZE).fill(null);

let mobSpawnTimer=0,animalSpawnTimer=0;
let sleeping=false,sleepTimer=0;

// ============================================================ 纹理: jsDelivr CDN + KygekDev Bedrock 仓库 (CORS支持)
const TEX_BASE='https://cdn.jsdelivr.net/gh/KygekDev/default-textures@master/textures/';
const TEX_MAP={

const textures={}; let texLoadCount=0, texTotal=0;

function loadAllTextures(onDone){
  const ids=Object.keys(DEFS).map(Number);
  texTotal=ids.length; let done=0;
  for(const id of ids){ textures[id]={img:null,loaded:false,canvas:null,fallback:makeFallback(id)}; }
  ids.forEach(id=>{
    const def=DEFS[id];
    if(!def.tex){
      textures[id].canvas=makeProcedural(id); textures[id].loaded=true; done++; checkDone(); return;
    }
    const img=new Image();
    img.crossOrigin='anonymous'; // jsDelivr 支持 CORS，canvas 不 taint
    let settled=false;
    const finish=(ok)=>{
      if(settled)return; settled=true;
      if(ok){
        const c=document.createElement('canvas'); c.width=16;c.height=16;
        const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
        g.drawImage(img,0,0,16,16);
        textures[id].img=img; textures[id].canvas=c; textures[id].loaded=true;
      }
      done++; checkDone();
    };
    img.onload=()=>finish(true);
    img.onerror=()=>finish(false);
    let path=def.tex; if(TEX_MAP[def.tex]) path=TEX_MAP[def.tex];
    img.src=TEX_BASE+path;
    setTimeout(()=>finish(false),6000);
  });
  function checkDone(){
    document.getElementById('loadFill').style.width=(done/texTotal*100)+'%';
    if(done>=texTotal) onDone();
  }
}

  if(type.startsWith('dig'))nb(0.06,400,0.02);else if(type==='place')nb(0.05,200,0.025);else if(type==='hurt')nb(0.1,150,0.05);else if(type==='jump'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(250,t);o.frequency.exponentialRampToValueAtTime(450,t+0.08);g.gain.setValueAtTime(0.025,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.08);}else if(type==='craft'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(350,t);o.frequency.exponentialRampToValueAtTime(550,t+0.1);g.gain.setValueAtTime(0.03,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.1);}

// 种子噪声系统
const worldSeed=(Date.now()%9999999+1);
function h1d(x,s){let h=((x*374761393)^(s*668265263))>>>0;h=((h>>16)^h)*0x45d9f3b;h=((h>>16)^h)*0x45d9f3b;return((h>>16)^h)/0x7FFFFFFF;}
function n1d(x,s){const x0=Math.floor(x),x1=x0+1,t=x-x0,st=t*t*(3-2*t);return h1d(x0,s)*(1-st)+h1d(x1,s)*st;}
function seedNoise(x,seed,oct){let v=0,f=1,amp=1,m=0;for(let i=0;i<oct;i++){v+=n1d(x*f,seed+i*997)*amp;m+=amp;f*=2.3;amp*=0.5;}return v/m;}
// ============================================================ 世界生成
function generateWorld(){
  world=[]; for(let x=0;x<W;x++)world[x]=new Uint8Array(H);
  const heights=new Array(W); const baseY=Math.floor(H*0.42);
  for(let x=0;x<W;x++){
    const h=baseY+seedNoise(x*0.022,worldSeed,5)*28-8;
    heights[x]=Math.max(10,Math.min(H-12,Math.floor(h)));
  }
  for(let x=0;x<W;x++){
    const surf=heights[x]; const isDesert=seedNoise(x*0.04+2.1,worldSeed+333,3)>0.65;
    for(let y=surf;y<H;y++){
      let b;
      if(y===surf)b=isDesert?6:1;
      else if(y<surf+(isDesert?5:4))b=isDesert?6:2;
      else{ b=3; const d=y-surf;
        if(d>8&&Math.random()<0.022)b=8;
        else if(d>16&&Math.random()<0.016)b=9;
        else if(d>20&&Math.random()<0.012)b=46; // 金矿石
        else if(d>28&&Math.random()<0.006)b=19; // 钻石矿深部
      }
      world[x][y]=b;
    }
  }
  // 水池(简单): 低洼处填水
  for(let x=0;x<W;x++){
    const surf=heights[x];
    if(heights[x-1]<surf||heights[x+1]<surf){
      const left=heights[x-1]||surf, right=heights[x+1]||surf;
      if(left<surf&&right<surf){
        const top=Math.max(left,right);
        for(let y=top;y<surf;y++) if(world[x][y]===0) world[x][y]=34; // 34=水(无定义，渲染为蓝)
      }
    }
  }
  // 树木
  for(let x=3;x<W-3;x++){
    if(seedNoise(x*0.08+11,worldSeed+777,3)>0.55)continue; const surf=heights[x];
    if(world[x][surf]!==1)continue;
    let near=false; for(let dx=-2;dx<=2;dx++)if(world[x+dx]&&world[x+dx][surf-1]===4){near=true;break;}
    if(near)continue;
    const th=4+ri(0,3); for(let i=1;i<=th;i++)world[x][surf-i]=4;
    const top=surf-th;
    for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=1;dy++){
      const lx=x+dx,ly=top+dy; if(lx<0||lx>=W||ly<0||ly>=H)continue;
      if(world[lx][ly]!==0)continue;
      if(Math.abs(dx)+Math.abs(dy)<=2&&Math.random()>0.18)world[lx][ly]=5;
    }
    world[x][top-1]=5;
  }
  // 洞穴
  for(let i=0;i<70;i++){
    const cx=10+ri(0,W-20),cy=heights[cx]+10+ri(0,H-heights[cx]-15),r=2+ri(0,3);
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){const x=cx+dx,y=cy+dy;if(x<0||x>=W||y<0||y>=H)continue;if(dx*dx+dy*dy<=r*r)world[x][y]=0;}
  }
  const sx=Math.floor(W/2); let sy=0;
  for(let y=0;y<H;y++)if(world[sx][y]!==0){sy=y;break;}
  player.x=sx+0.2; player.y=sy-CFG.PH-0.2;
  camX=player.x-10; camY=player.y-8;
}
function getBlock(x,y){ if(x<0||x>=W||y<0||y>=H)return y<H?0:1; return world[x][y]; }
function setBlock(x,y,id){ if(x<0||x>=W||y<0||y>=H)return; world[x][y]=id; }
function isSolidAt(x,y){ const b=getBlock(x,y); return b!==0&&SOLID.has(b); }
function isWaterAt(x,y){ return getBlock(x,y)===34; }

// ============================================================ 物理
function collideX(){
  const top=Math.floor(player.y+0.002),bot=Math.floor(player.y+CFG.PH-0.002);
  if(player.vx>0){const r=Math.floor(player.x+CFG.PW);for(let y=top;y<=bot;y++)if(isSolidAt(r,y)){player.x=r-CFG.PW;player.vx=0;return;}}
  else if(player.vx<0){const l=Math.floor(player.x);for(let y=top;y<=bot;y++)if(isSolidAt(l,y)){player.x=l+1;player.vx=0;return;}}
}
function collideY(){
  const l=Math.floor(player.x+0.002),r=Math.floor(player.x+CFG.PW-0.002);
  if(player.vy>0){const b=Math.floor(player.y+CFG.PH);for(let x=l;x<=r;x++)if(isSolidAt(x,b)){player.y=b-CFG.PH;player.vy=0;player.onGround=true;return;}}
  else if(player.vy<0){const t=Math.floor(player.y);for(let x=l;x<=r;x++)if(isSolidAt(x,t)){player.y=t+1;player.vy=0;return;}}
}
function updatePhysics(){
  let ax=0;
  if(keys['a']||keys['arrowleft']){ax-=CFG.MOVE_ACCEL;player.facing=-1;}
  if(keys['d']||keys['arrowright']){ax+=CFG.MOVE_ACCEL;player.facing=1;}
  if(player.onGround){player.vx+=ax;player.vx*=CFG.GROUND_FRICTION;if(Math.abs(player.vx)<0.002)player.vx=0;}
  else{player.vx+=ax*0.55;player.vx*=CFG.AIR_FRICTION;}
  player.vx=Math.max(-CFG.MAX_MOVE,Math.min(CFG.MAX_MOVE,player.vx));
  const jp=keys[' ']||keys['w']||keys['arrowup'];
  if(jp&&!player._jp)player.jumpBuf=CFG.JUMP_BUFFER;
  player._jp=jp;
  if(player.jumpBuf>0)player.jumpBuf--;
  if(player.onGround){player.coyote=CFG.COYOTE;player.doubleJump=true;} else if(player.coyote>0)player.coyote--;
  if(player.jumpBuf>0&&player.coyote>0){player.vy=-CFG.JUMP;player.onGround=false;player.coyote=0;player.jumpBuf=0;player.jumpHold=0;playSound('jump');}
  else if(player.jumpBuf>0&&player.doubleJump){player.vy=-CFG.JUMP*0.8;player.doubleJump=false;player.jumpBuf=0;player.jumpHold=0;playSound('jump');}
  if(jp&&player.vy<0&&player.jumpHold<CFG.JUMP_HOLD_MAX){player.vy-=CFG.JUMP_HOLD;player.jumpHold++;}
  // 水中减速
  const inWater=isWaterAt(Math.floor(player.x+CFG.PW/2),Math.floor(player.y+CFG.PH/2));
  let g=CFG.GRAVITY;
  if(inWater){ g*=0.3; player.vy*=0.6; if(jp)player.vy=-0.18; }
  player.vy+=g;
  if(player.vy>CFG.MAX_FALL)player.vy=CFG.MAX_FALL;
  player.x+=player.vx; collideX();
  player.y+=player.vy; player.onGround=false; collideY();
  if(player.x<0){player.x=0;player.vx=0;}
  if(player.x+CFG.PW>W){player.x=W-CFG.PW;player.vx=0;}
  if(player.y>H+5)damage(99);
  if(player.swing>0)player.swing--;
  if(player.hurtCD>0)player.hurtCD--;
  if(attackCD>0)attackCD--;
}

// ============================================================ 掉落物系统 (还原MC: 掉落在地面, 靠近拾取)
const droppedItems=[];
function spawnDrop(x,y,type,count){
  droppedItems.push({x:x+0.2+Math.random()*0.6,y:y-0.1,vx:(Math.random()-0.5)*0.06,vy:-0.1,type,count,onGround:false,life:600,bob:Math.random()*Math.PI*2});
}
function updateDrops(){
  for(let i=droppedItems.length-1;i>=0;i--){
    const d=droppedItems[i];d.bob+=0.05;d.life--;
    d.vy+=CFG.GRAVITY*0.7;d.y+=d.vy;d.x+=d.vx;d.vx*=0.92;
    const bx=Math.floor(d.x),by=Math.floor(d.y);
    if(by>=0&&by<H&&isSolidAt(bx,by)){d.y=by-0.05;d.vy=0;d.vx*=0.5;d.onGround=true;}
    const dx=player.x+CFG.PW/2-d.x,dy=player.y+CFG.PH/2-d.y,dist=Math.hypot(dx,dy);
    if(dist<1.8&&d.life<560){d.vx+=dx/dist*0.035;d.vy+=dy/dist*0.035;if(dist<0.45){addToInventory(d.type,d.count);droppedItems.splice(i,1);}}
    if(d.life<=0||d.y>H+5)droppedItems.splice(i,1);
  }
}
function updateParticles(){ for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.vy+=0.012;p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.life--;if(p.life<=0)particles.splice(i,1);} }

// ============================================================ 生物: 僵尸
function spawnMob(){
  if(mobs.filter(m=>!m.dead).length>=7)return;
  const sx=player.x+(Math.random()<0.5?-1:1)*(16+ri(0,8)); const ix=Math.floor(sx);
  if(ix<1||ix>=W-1)return; let sy=-1;
  for(let y=0;y<H;y++)if(world[ix]&&world[ix][y]!==0){sy=y;break;} if(sy<0)return;
  mobs.push({x:ix+0.2,y:sy-2.0,vx:0,vy:0,onGround:false,facing:1,hp:10,maxHp:10,dead:false,flash:0,kb:0,attackCD:0,jumpCD:0,type:'zombie'});
}
function updateMobs(){
  for(const m of mobs){
    if(m.dead)continue; if(m.flash>0)m.flash--; if(m.attackCD>0)m.attackCD--; if(m.jumpCD>0)m.jumpCD--;
    const dir=player.x>m.x?1:-1; m.facing=dir;
    let mv=0.016*dir; if(m.kb){mv=m.kb;m.kb*=0.7;if(Math.abs(m.kb)<0.01)m.kb=0;}
    m.x+=mv;
    const top=Math.floor(m.y+0.1),bot=Math.floor(m.y+1.7);
    if(mv>0){const r=Math.floor(m.x+0.6);let hit=false;for(let y=top;y<=bot;y++)if(isSolidAt(r,y)){hit=true;break;}if(hit){if(m.onGround&&!m.jumpCD){m.vy=-0.18;m.jumpCD=35;m.onGround=false;}else{m.x=r-0.6;}}}
    else if(mv<0){const l=Math.floor(m.x);let hit=false;for(let y=top;y<=bot;y++)if(isSolidAt(l,y)){hit=true;break;}if(hit){if(m.onGround&&!m.jumpCD){m.vy=-0.18;m.jumpCD=35;m.onGround=false;}else{m.x=l+1;}}}
    m.vy+=CFG.GRAVITY; if(m.vy>CFG.MAX_FALL)m.vy=CFG.MAX_FALL;
    m.y+=m.vy; m.onGround=false;
    const ml=Math.floor(m.x+0.1),mr=Math.floor(m.x+0.5);
    if(m.vy>0){const b=Math.floor(m.y+1.8);for(let x=ml;x<=mr;x++)if(isSolidAt(x,b)){m.y=b-1.8;m.vy=0;m.onGround=true;break;}}
    else if(m.vy<0){const tt=Math.floor(m.y);for(let x=ml;x<=mr;x++)if(isSolidAt(x,tt)){m.y=tt+1;m.vy=0;break;}}
    if(Math.abs(m.x-player.x)<1&&Math.abs(m.y-player.y)<2&&m.attackCD<=0){damage(2,dir);m.attackCD=40;}
    if(dayTime<0.5&&frame%9===0){
      let exposed=true; const sx=Math.floor(m.x+0.35);
      for(let y=Math.floor(m.y);y>=0;y--){ if(sx>=0&&sx<W&&world[sx][y]!==0){exposed=false;break;} }
      if(exposed){ m.hp--; spawnParticles(m.x,m.y,'#ffa040',1); if(m.hp<=0)m.dead=true; }
    }
  }
  for(let i=mobs.length-1;i>=0;i--)if(mobs[i].dead||mobs[i].y>H+10)mobs.splice(i,1);
}

// ============================================================ 动物: 牛羊猪鸡
function spawnAnimal(){
  if(animals.filter(a=>!a.dead).length>=8)return;
  const sx=player.x+(Math.random()<0.5?-1:1)*(14+ri(0,10)); const ix=Math.floor(sx);
  if(ix<1||ix>=W-1)return; let sy=-1;
  for(let y=0;y<H;y++)if(world[ix]&&world[ix][y]!==0&&world[ix][y]!==34&&world[ix][y]!==5&&world[ix][y]!==4){sy=y;break;} if(sy<0)return;
  const types=[{type:'cow',hp:10,drop:22,extra:43,color:'#6a4a2a'},{type:'sheep',hp:8,drop:16,color:'#e8e8e8'},{type:'pig',hp:10,drop:23,color:'#e8a8b8'},{type:'chicken',hp:4,drop:42,extra:32,color:'#e8e8d0',small:true}];
  const t=types[ri(0,3)];
  animals.push({x:ix+0.2,y:sy-2.0,vx:0,vy:0,onGround:false,facing:1,hp:t.hp,maxHp:t.hp,dead:false,flash:0,kb:0,flee:0,jumpCD:0,wanderT:ri(60,200),type:t.type,drop:t.drop,extra:t.extra,color:t.color,small:t.small});
}
function updateAnimals(){
  for(const a of animals){
    if(a.dead)continue; if(a.flash>0)a.flash--; if(a.flee>0)a.flee--; if(a.jumpCD>0)a.jumpCD--;
    a.wanderT--;
    if(a.wanderT<=0){ a.wanderT=ri(90,280); a.idle=Math.random()<0.55; if(!a.idle)a.facing=Math.random()<0.5?-1:1; }
    let mv=a.idle?0:0.008*a.facing;
    if(a.flee>0){ const dir=player.x>a.x?-1:1; mv=0.022*dir; a.facing=dir; }
    if(a.kb){mv=a.kb;a.kb*=0.7;if(Math.abs(a.kb)<0.01)a.kb=0;}
    a.x+=mv;
    const h=a.small?1.0:1.4;
    const top=Math.floor(a.y+0.1),bot=Math.floor(a.y+h);
    if(mv>0){const r=Math.floor(a.x+(a.small?0.5:0.6));let hit=false;for(let y=top;y<=bot;y++)if(isSolidAt(r,y)){hit=true;break;}if(hit){if(a.onGround&&!a.jumpCD){a.vy=-0.12;a.jumpCD=45;a.onGround=false;}else a.x=r-(a.small?0.5:0.6);}}
    else if(mv<0){const l=Math.floor(a.x);let hit=false;for(let y=top;y<=bot;y++)if(isSolidAt(l,y)){hit=true;break;}if(hit){if(a.onGround&&!a.jumpCD){a.vy=-0.12;a.jumpCD=45;a.onGround=false;}else a.x=l+1;}}
    a.vy+=CFG.GRAVITY; if(a.vy>CFG.MAX_FALL)a.vy=CFG.MAX_FALL;
    a.y+=a.vy; a.onGround=false;
    const ml=Math.floor(a.x+0.1),mr2=Math.floor(a.x+(a.small?0.4:0.5));
    if(a.vy>0){const b=Math.floor(a.y+h);for(let x=ml;x<=mr2;x++)if(isSolidAt(x,b)){a.y=b-h;a.vy=0;a.onGround=true;break;}}
    else if(a.vy<0){const tt=Math.floor(a.y);for(let x=ml;x<=mr2;x++)if(isSolidAt(x,tt)){a.y=tt+1;a.vy=0;break;}}
  }
  for(let i=animals.length-1;i>=0;i--)if(animals[i].dead||animals[i].y>H+10)animals.splice(i,1);
}
function onAnimalDeath(a){
  addToInventory(a.drop,1);
  if(a.extra)addToInventory(a.extra,Math.random()<0.5?1:0);
  spawnParticles(a.x,a.y,a.color,8);
}

// ============================================================ 状态
function damage(amt,fromDir){
  if(player.hurtCD>0||sleeping)return;
  stats.health-=amt; player.hurtCD=30;
  if(fromDir)player.vx+=fromDir*0.15;
  player.vy=-0.2; playSound('hurt');
  if(stats.health<=0)respawn();
}
function respawn(){
  stats.health=20; stats.hunger=20;
  const sx=Math.floor(W/2); let sy=0;
  for(let y=0;y<H;y++)if(world[sx][y]!==0&&world[sx][y]!==34){sy=y;break;}
  player.x=sx+0.2; player.y=sy-CFG.PH-0.2; player.vx=0; player.vy=0;
}
function updateStats(){
  stats.hungerTimer++;
  if(stats.hungerTimer>300){stats.hungerTimer=0; if(stats.hunger>0)stats.hunger--; else{stats.regenTimer++; if(stats.regenTimer>60){stats.regenTimer=0; damage(1);}}}
  if(stats.hunger>=14&&stats.health<stats.maxHealth){stats.regenTimer++; if(stats.regenTimer>120){stats.regenTimer=0; stats.health=Math.min(stats.maxHealth,stats.health+1);}}
}
function eat(){
  const slot=inventory[selectedSlot]; if(!slot)return;
  const def=DEFS[slot.type]; if(!def||!def.food)return;
  stats.hunger=Math.min(stats.maxHunger,stats.hunger+def.food);
  consumeSelected(); playSound('eat'); updateInventoryUI();
}

// ============================================================ 床/睡觉
function trySleep(){
  if(dayTime<0.5||dayTime>0.95){ addToast('只能在夜晚睡觉'); return; }
  sleeping=true; sleepTimer=60; playSound('sleep');
}
function updateSleep(){
  if(!sleeping)return;
  sleepTimer--;
  if(sleepTimer<=0){ sleeping=false; dayTime=0.02; addToast('已跳到白天'); }
}

// Toast
const toasts=[];
function addToast(msg){ toasts.push({msg,life:120}); }
function updateToasts(){ for(let i=toasts.length-1;i>=0;i--){toasts[i].life--; if(toasts[i].life<=0)toasts.splice(i,1);} }
function updateWater(){
  if(frame%25!==0)return;
  for(let y=H-2;y>=0;y--)for(let x=0;x<W;x++){
    if(world[x][y]!==34)continue;
    // 向下流
    if(y+1<H&&world[x][y+1]===0){world[x][y+1]=34;continue;}
    // 左右有限扩散(最大4格) - 只在有固体底时扩散
    if(world[x][y+1]!==34&&Math.random()<0.25){
      const d=Math.random()<0.5?-1:1;
      for(let i=1;i<=3;i++){
        const nx=x+d*i;if(nx<0||nx>=W)break;
        if(world[nx][y]===34)break;
        if(world[nx][y]!==0)break;
        if(y+1>=H||world[nx][y+1]!==0){world[nx][y]=34;break;}
        if(world[nx][y+1]===0)continue;
      }
    }
  }
}

// ============================================================ 背包
function addToInventory(type,count){
  count=count||1;
  for(let i=0;i<INV_SIZE;i++)if(inventory[i]&&inventory[i].type===type&&inventory[i].count<CFG.STACK){const add=Math.min(CFG.STACK-inventory[i].count,count);inventory[i].count+=add;count-=add;if(count<=0)return true;}
  for(let i=0;i<INV_SIZE;i++)if(!inventory[i]){inventory[i]={type,count:Math.min(CFG.STACK,count)};count-=inventory[i].count;if(count<=0)return true;}
  return count<=0;
}
function consumeSelected(){const s=inventory[selectedSlot];if(!s)return false;s.count--;if(s.count<=0)inventory[selectedSlot]=null;return true;}
function countItem(type){let n=0;for(const it of inventory)if(it&&it.type===type)n+=it.count;return n;}
function removeItem(type,count){for(let i=INV_SIZE-1;i>=0&&count>0;i--){const it=inventory[i];if(it&&it.type===type){const r=Math.min(it.count,count);it.count-=r;count-=r;if(it.count<=0)inventory[i]=null;}}}
function clickSlot(index,button){
  if(index<0||index>=INV_SIZE)return;
  if(!inventoryOpen){if(index<9&&button===0)selectedSlot=index;updateInventoryUI();return;}
  const slot=inventory[index];
  if(button===0){const tmp=inventory[index];inventory[index]=cursorItem;cursorItem=tmp;}
  else if(button===2){
    if(cursorItem){if(slot&&slot.type===cursorItem.type&&slot.count<CFG.STACK){slot.count++;cursorItem.count--;if(cursorItem.count<=0)cursorItem=null;}else if(!slot){inventory[index]={type:cursorItem.type,count:1};cursorItem.count--;if(cursorItem.count<=0)cursorItem=null;}}
    else if(slot){cursorItem={type:slot.type,count:1};slot.count--;if(slot.count<=0)inventory[index]=null;}
  }
  updateInventoryUI(); updateCursorItem();
}

// ============================================================ 合成
function canCraft(r){for(const m of r.in)if(countItem(m.t)<m.c)return false;return true;}
function craft(r){if(!canCraft(r))return;for(const m of r.in)removeItem(m.t,m.c);addToInventory(r.out[0],r.out[1]);playSound('craft');updateInventoryUI();updateCraftingUI();}
function updateCraftingUI(){
  const list=document.getElementById('recipeList'); list.innerHTML='';
  const title=document.querySelector('#crafting .title');
  if(title)title.textContent=craftingLevel===2?'工作台合成 (右键工作台打开)':'简易合成 (C键打开 · 工具请用工作台)';
  for(const r of activeRecipes){
    const ok=canCraft(r); const div=document.createElement('div'); div.className='recipe'+(ok?'':' disabled');
    const icon=document.createElement('canvas'); icon.width=36; icon.height=36; icon.className='r-out'; drawIconTo(icon,r.out[0]);
    const name=document.createElement('div'); name.className='r-name'; name.textContent=r.name;
    const cnt=document.createElement('span'); cnt.className='r-count'; cnt.textContent='×'+r.out[1]; name.appendChild(cnt);
    const need=document.createElement('div'); need.className='r-in'; need.textContent=r.in.map(m=>DEFS[m.t].name+'×'+m.c).join(' · ');
    div.appendChild(icon); div.appendChild(name); div.appendChild(need);
    if(ok)div.addEventListener('click',()=>craft(r));
    list.appendChild(div);
  }
}

// ============================================================ 熔炉
let furnace={bx:0,by:0,in:null,fuel:null,out:null,burn:0,cook:0};
function openFurnace(bx,by){ furnace.bx=bx; furnace.by=by; furnaceOpen=true; document.getElementById('furnace').classList.add('open'); updateFurnaceUI(); }
function closeFurnace(){ if(furnaceOpen){ furnaceOpen=false; document.getElementById('furnace').classList.remove('open'); // 把物品退回背包
  if(furnace.in){addToInventory(furnace.in.type,furnace.in.count);furnace.in=null;}
  if(furnace.fuel){addToInventory(furnace.fuel.type,furnace.fuel.count);furnace.fuel=null;}
  if(furnace.out){addToInventory(furnace.out.type,furnace.out.count);furnace.out=null;}
  furnace.burn=0; furnace.cook=0; updateInventoryUI(); } }
function furnaceClick(cell,button){
  const cur = cell==='in'?furnace.in:cell==='fuel'?furnace.fuel:furnace.out;
  if(cell==='out'){ if(cur&&cursorItem){ /*不放*/ } else if(cur){ addToInventory(cur.type,cur.count); furnace[cell]=null; } updateFurnaceUI(); return; }
  if(button===0){ const tmp=furnace[cell]; furnace[cell]=cursorItem; cursorItem=tmp; }
  updateFurnaceUI(); updateCursorItem();
}
function updateFurnace(){
  if(!furnaceOpen)return;
  // 燃烧
  if(furnace.burn>0) furnace.burn--;
  else if(furnace.fuel && FUELS[furnace.fuel.type] && (furnace.in&&SMELT[furnace.in.type])){
    furnace.burn=FUELS[furnace.fuel.type]*60; furnace.fuel.count--; if(furnace.fuel.count<=0)furnace.fuel=null;
  }
  // 冶炼
  if(furnace.burn>0 && furnace.in && SMELT[furnace.in.type]){
    const sm=SMELT[furnace.in.type];
    if(!furnace.out || (furnace.out.type===sm.out && furnace.out.count<CFG.STACK)){
      furnace.cook++;
      if(furnace.cook>=sm.time*60){ furnace.cook=0; furnace.in.count--; if(furnace.in.count<=0)furnace.in=null;
        if(furnace.out) furnace.out.count++; else furnace.out={type:sm.out,count:1}; }
    }
  } else furnace.cook=0;
  updateFurnaceUI();
}
function updateFurnaceUI(){
  if(!furnaceOpen)return;
  setFcell('furnIn',furnace.in); setFcell('furnFuel',furnace.fuel); setFcell('furnOut',furnace.out);
  document.getElementById('furnFlame').style.opacity = furnace.burn>0?1:0.2;
}
function setFcell(id,item){
  const cell=document.getElementById(id); const ic=cell.querySelector('canvas'), cn=cell.querySelector('.count');
  if(item){ drawIconTo(ic,item.type); cn.textContent=item.count>1?item.count:''; }
  else { ic.getContext('2d').clearRect(0,0,40,40); cn.textContent=''; }
}

// ============================================================ UI
function buildHotbar(){const hb=document.getElementById('hotbar');hb.innerHTML='';for(let i=0;i<9;i++){const s=document.createElement('div');s.className='slot';s.dataset.index=i;s.innerHTML='<span class="keybind">'+(i+1)+'</span><canvas class="icon" width="40" height="40"></canvas><div class="count"></div>';s.addEventListener('mousedown',e=>{e.preventDefault();clickSlot(i,e.button);});s.addEventListener('contextmenu',e=>e.preventDefault());hb.appendChild(s);}}
function buildInventoryUI(){const g=document.getElementById('invGrid');g.innerHTML='';for(let i=9;i<36;i++)g.appendChild(makeInvSlot(i));const hb=document.getElementById('invHotbar');hb.innerHTML='';for(let i=0;i<9;i++)hb.appendChild(makeInvSlot(i));}
function makeInvSlot(i){const s=document.createElement('div');s.className='slot';s.dataset.index=i;s.innerHTML='<canvas class="icon" width="40" height="40"></canvas><div class="count"></div>';s.addEventListener('mousedown',e=>{e.preventDefault();clickSlot(i,e.button);});s.addEventListener('contextmenu',e=>e.preventDefault());return s;}
function updateInventoryUI(){
  const hb=document.getElementById('hotbar').children;
  for(let i=0;i<9;i++){const s=hb[i],it=inventory[i];s.classList.toggle('selected',i===selectedSlot);const ic=s.querySelector('.icon'),cn=s.querySelector('.count');if(it){drawIconTo(ic,it.type);cn.textContent=it.count>1?it.count:'';}else{ic.getContext('2d').clearRect(0,0,40,40);cn.textContent='';}}
  if(inventoryOpen){document.querySelectorAll('#inventory .slot').forEach(s=>{const i=parseInt(s.dataset.index),it=inventory[i];const ic=s.querySelector('.icon'),cn=s.querySelector('.count');if(it){drawIconTo(ic,it.type);cn.textContent=it.count>1?it.count:'';}else{ic.getContext('2d').clearRect(0,0,40,40);cn.textContent='';}});}
}
function updateCursorItem(){const el=document.getElementById('cursorItem');if(cursorItem){el.style.display='block';drawIconTo(el.querySelector('canvas'),cursorItem.type);el.querySelector('.count').textContent=cursorItem.count>1?cursorItem.count:'';}else el.style.display='none';}
function toggleInventory(o){inventoryOpen=o===undefined?!inventoryOpen:o;document.getElementById('inventory').classList.toggle('open',inventoryOpen);if(!inventoryOpen&&cursorItem){addToInventory(cursorItem.type,cursorItem.count);cursorItem=null;}updateInventoryUI();updateCursorItem();}
function toggleCrafting(lvl){ // lvl:1=简易合成,2=工作台合成,undefined=toggle
  if(lvl===undefined)lvl=craftingOpen?0:craftingLevel;
  craftingOpen=lvl>0; craftingLevel=lvl||1;
  if(lvl===2)activeRecipes=[...BASIC_RECIPES,...TABLE_RECIPES];
  else activeRecipes=BASIC_RECIPES;
  document.getElementById('crafting').classList.toggle('open',craftingOpen);
  if(craftingOpen)updateCraftingUI();
}
function updateHUD(){
  const hc=document.getElementById('hearts'),hg=document.getElementById('hunger');hc.innerHTML='';hg.innerHTML='';
  const h=Math.ceil(stats.health),hu=Math.ceil(stats.hunger);
  for(let i=0;i<10;i++){const img=document.createElement('img');img.src='data:image/svg+xml;utf8,'+encodeURIComponent(heartSVG(i*2+1<=h?2:(i*2===h?1:0)));img.className='heart';hc.appendChild(img);}
  for(let i=0;i<10;i++){const img=document.createElement('img');img.src='data:image/svg+xml;utf8,'+encodeURIComponent(hungerSVG(i*2+1<=hu?2:(i*2===hu?1:0)));img.className='drumstick';hg.appendChild(img);}
}
function heartSVG(lv){const c=lv===2?'#ff4040':lv===1?'#a02020':'#3a1010';return `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 9 9"><path fill="${c}" d="M1 2h1v1h1V2h1v1h1V2h1v1h1v2H6v1H5v1H4v1H3V7H2V6H1V4h0z"/></svg>`;}
function hungerSVG(lv){const c=lv===2?'#c88030':lv===1?'#804020':'#3a2810';return `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 9 9"><path fill="${c}" d="M3 2h3v1h1v2H6v1H5v1H4V5H3V3h0z"/><circle cx="4.5" cy="3.5" r="1.2" fill="${c}"/></svg>`;}

// ============================================================ 渲染
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;ctx.imageSmoothingEnabled=false;}
function getSkyColor(){
  const t=dayTime; const dayTop=[110,178,255],dayBot=[180,220,255],nightTop=[8,12,40],nightBot=[20,30,70],duskTop=[200,90,50],duskBot=[230,150,90];
  function lc(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
  let tc,bc;
  if(t<0.5){const k=t/0.5; if(k<0.5){const p=k/0.5;tc=lc(nightTop,dayTop,p);bc=lc(nightBot,dayBot,p);}else{const p=(k-0.5)/0.5;tc=lc(dayTop,duskTop,p);bc=lc(dayBot,duskBot,p);}}
  else{const k=(t-0.5)/0.5; if(k<0.3){const p=k/0.3;tc=lc(duskTop,nightTop,p);bc=lc(duskBot,nightBot,p);}else{tc=nightTop;bc=nightBot;}}
  return {top:`rgb(${tc.map(v=>v|0).join(',')})`,bot:`rgb(${bc.map(v=>v|0).join(',')})`,dark:t>0.55||t<0.05};
}
function render(){
  const sky=getSkyColor(); const g=ctx.createLinearGradient(0,0,0,canvas.height); g.addColorStop(0,sky.top);g.addColorStop(1,sky.bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(sky.dark){ctx.fillStyle='rgba(255,255,255,0.8)';for(let i=0;i<60;i++){const sx=(i*937%canvas.width),sy=((i*547)%(canvas.height*0.5));const tw=Math.sin(dayTime*Math.PI*2+i)*0.5+0.5;ctx.globalAlpha=tw*0.7;ctx.fillRect(sx,sy,2,2);}ctx.globalAlpha=1;}
  const ang=(dayTime-0.25)*Math.PI*2, sunX=canvas.width*0.5+Math.cos(ang)*canvas.width*0.4, sunY=canvas.height*0.4-Math.sin(ang)*canvas.height*0.35;
  if(sunY<canvas.height){ctx.fillStyle=dayTime>0.5?'#e0e0e0':'#ffe060';ctx.beginPath();ctx.arc(sunX,sunY,18,0,Math.PI*2);ctx.fill();}
  const tcx=player.x+CFG.PW/2-canvas.width/CFG.TILE/2, tcy=player.y+CFG.PH/2-canvas.height/CFG.TILE/2;
  camX+=(tcx-camX)*0.1; camY+=(tcy-camY)*0.1;
  camX=Math.max(0,Math.min(W-canvas.width/CFG.TILE,camX)); camY=Math.max(-5,Math.min(H-canvas.height/CFG.TILE,camY));
  const sx0=Math.floor(camX)-1,sx1=Math.ceil(camX+canvas.width/CFG.TILE)+1,sy0=Math.floor(camY)-1,sy1=Math.ceil(camY+canvas.height/CFG.TILE)+1;
  for(let x=sx0;x<sx1;x++){if(x<0||x>=W)continue;for(let y=sy0;y<sy1;y++){if(y<0)continue;if(y>=H)break;const b=world[x][y];if(b===0)continue;
    const px2=Math.floor((x-camX)*CFG.TILE),py=Math.floor((y-camY)*CFG.TILE);
    if(b===34){const wt=textures[34]; if(wt&&wt.loaded){ctx.globalAlpha=0.8;ctx.drawImage(wt.img,0,0,16,16,px2,py,CFG.TILE,CFG.TILE);ctx.globalAlpha=1;}else{ctx.fillStyle='rgba(50,130,230,0.65)';ctx.fillRect(px2,py,CFG.TILE,CFG.TILE);}continue;}
    const t=getTexCanvas(b);
    if(t)ctx.drawImage(t,0,0,16,16,px2,py,CFG.TILE,CFG.TILE);
    else{ctx.fillStyle=DEFS[b]?DEFS[b].color:'#888';ctx.fillRect(px2,py,CFG.TILE,CFG.TILE);}
  }}
  // 破坏裂纹
  if(breaking&&breaking.prog>0){const px2=Math.floor((breaking.x-camX)*CFG.TILE),py=Math.floor((breaking.y-camY)*CFG.TILE);const stage=Math.min(9,Math.floor(breaking.prog*10));ctx.globalAlpha=0.5;ctx.fillStyle='#000';for(let i=0;i<=stage;i++){const rx=px2+((i*7)%CFG.TILE),ry=py+((i*13)%CFG.TILE);ctx.fillRect(rx,ry,2,2);ctx.fillRect(rx+3,ry+1,1,1);}ctx.globalAlpha=1;ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(px2,py-4,CFG.TILE,3);ctx.fillStyle='#7fff7f';ctx.fillRect(px2,py-4,CFG.TILE*breaking.prog,3);}
  for(const m of mobs)drawMob(m);
  for(const a of animals)drawAnimal(a);
  drawPlayer();
  for(const p of particles){const px2=Math.floor((p.x-camX)*CFG.TILE),py=Math.floor((p.y-camY)*CFG.TILE);ctx.fillStyle=p.color;ctx.fillRect(px2,py,p.size,p.size);}
  // 绘制掉落物
  for(const d of droppedItems){
    const dx=Math.floor((d.x-camX)*CFG.TILE),dy=Math.floor((d.y+Math.sin(d.bob)*0.08-camY)*CFG.TILE);
    const tc=getTexCanvas(d.type);const s=Math.floor(CFG.TILE*0.38);
    if(tc){ctx.globalAlpha=Math.min(1,d.life/30);ctx.drawImage(tc,0,0,16,16,dx-s/2,dy-s/2,s,s);ctx.globalAlpha=1;}
    else{ctx.fillStyle=DEFS[d.type]?DEFS[d.type].color:'#fff';ctx.fillRect(dx-4,dy-4,8,8);}
  }
  drawTargetBox();
  if(sky.dark){ctx.fillStyle=`rgba(0,0,30,${settings.night/100})`;ctx.fillRect(0,0,canvas.width,canvas.height);}
  if(player.hurtCD>20){ctx.fillStyle='rgba(255,0,0,'+((player.hurtCD-20)/10*0.3)+')';ctx.fillRect(0,0,canvas.width,canvas.height);}
  if(sleeping){ctx.fillStyle='rgba(0,0,0,'+((60-sleepTimer)/60*0.85)+')';ctx.fillRect(0,0,canvas.width,canvas.height);}
  // Toast
  ctx.fillStyle='#fff'; ctx.font='14px Microsoft YaHei'; ctx.textAlign='center';
  for(let i=0;i<toasts.length;i++){const ty=canvas.height/2+i*22; ctx.globalAlpha=Math.min(1,toasts[i].life/30); ctx.fillText(toasts[i].msg,canvas.width/2,ty);}
  ctx.globalAlpha=1; ctx.textAlign='left';
}
function drawPlayer(){
  const sx=Math.floor((player.x-camX)*CFG.TILE),sy=Math.floor((player.y-camY)*CFG.TILE),pw=CFG.PW*CFG.TILE,ph=CFG.PH*CFG.TILE,f=player.facing;
  if(steveTex){ctx.save();ctx.translate(sx+pw/2,sy+ph*0.05);ctx.scale(f,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(steveTex,-pw*0.62,-ph*0.02,pw*1.24,ph*0.98);ctx.restore();return;}
  const swing=player.swing>0?Math.sin((8-player.swing)/8*Math.PI)*0.25:0;
  ctx.save(); ctx.translate(sx+pw/2,sy+ph*0.15); ctx.scale(f,1);
  ctx.imageSmoothingEnabled=false;
  // 像素角色(8x14比例, MC Steve风格)
  const bw=pw*1.2,bh=ph*0.82,ox=-bw/2;
  // 头
  ctx.fillStyle='#b88060';ctx.fillRect(ox+bw*0.25,0,bw*0.5,bh*0.25);
  // 头发
  ctx.fillStyle='#3a2210';ctx.fillRect(ox+bw*0.25,0,bw*0.5,bh*0.06);ctx.fillRect(ox+bw*0.75,0,bw*0.08,bh*0.08);
  // 眼
  ctx.fillStyle='#fff';ctx.fillRect(ox+bw*0.42,0+bh*0.09,bw*0.14,bh*0.04);ctx.fillStyle='#4a28b8';ctx.fillRect(ox+bw*0.46,0+bh*0.09,bw*0.08,bh*0.04);
  // 身体(青蓝T恤)
  ctx.fillStyle='#3a9a9a';ctx.fillRect(ox+bw*0.3,0+bh*0.25,bw*0.4,bh*0.36);
  // 身体深色线
  ctx.fillStyle='#2a7070';ctx.fillRect(ox+bw*0.3,0+bh*0.25,bw*0.4,bh*0.02);
  ctx.fillStyle='#1a4a5a';ctx.fillRect(ox+bw*0.3,0+bh*0.6,bw*0.4,bh*0.02);
  // 手臂(前,带摆动)
  ctx.save();ctx.translate(ox+bw*0.7,0+bh*0.27);ctx.rotate(swing);
  ctx.fillStyle='#b88060';ctx.fillRect(0,0,(f>0?1:-1)*bw*0.15,bh*0.24);
  ctx.restore();
  // 手臂(后)
  ctx.fillStyle='#a07050';ctx.fillRect(ox+bw*0.15,0+bh*0.27,bw*0.15,bh*0.24);
  // 腿(深蓝裤)
  ctx.fillStyle='#1a1a4a';ctx.fillRect(ox+bw*0.32,0+bh*0.61,bw*0.16,bh*0.22);
  ctx.fillStyle='#1a2555';ctx.fillRect(ox+bw*0.52,0+bh*0.61,bw*0.16,bh*0.22);
  // 鞋
  ctx.fillStyle='#0a0a1a';ctx.fillRect(ox+bw*0.3,0+bh*0.82,bw*0.2,bh*0.03);ctx.fillRect(ox+bw*0.5,0+bh*0.82,bw*0.2,bh*0.03);
  ctx.restore();
}
function drawMob(m){
  const sx=Math.floor((m.x-camX)*CFG.TILE),sy=Math.floor((m.y-camY)*CFG.TILE),pw=0.6*CFG.TILE,ph=1.8*CFG.TILE,f=m.facing;
  const flash=m.flash>0;
  ctx.save(); ctx.translate(sx+pw/2,sy+ph*0.15); ctx.scale(f,1);
  const bw=pw*1.2,bh=ph*0.82,ox=-bw/2;
  // 头(绿皮)
  ctx.fillStyle=flash?'#fff':'#5a8a4a';ctx.fillRect(ox+bw*0.25,0,bw*0.5,bh*0.25);
  // 眼(红)
  ctx.fillStyle='#ff3030';ctx.fillRect(ox+bw*0.4,0+bh*0.09,bw*0.08,bh*0.04);ctx.fillRect(ox+bw*0.52,0+bh*0.09,bw*0.08,bh*0.04);
  // 身体(破青蓝衣)
  ctx.fillStyle=flash?'#fff':'#3a7a7a';ctx.fillRect(ox+bw*0.3,0+bh*0.25,bw*0.4,bh*0.36);
  ctx.fillStyle='#1a3a5a';ctx.fillRect(ox+bw*0.55,0+bh*0.3,bw*0.1,bh*0.08);
  // 手臂
  ctx.fillStyle=flash?'#fff':'#4a7a3a';ctx.fillRect(ox+bw*0.7,0+bh*0.27,bw*0.15,bh*0.24);
  ctx.fillStyle=flash?'#fff':'#3a5a2a';ctx.fillRect(ox+bw*0.15,0+bh*0.27,bw*0.15,bh*0.24);
  // 腿
  ctx.fillStyle=flash?'#fff':'#1a2a3a';ctx.fillRect(ox+bw*0.32,0+bh*0.61,bw*0.16,bh*0.22);
  ctx.fillRect(ox+bw*0.52,0+bh*0.61,bw*0.16,bh*0.22);
  ctx.restore();
  if(m.hp<m.maxHp){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(sx,sy-8,pw,4);ctx.fillStyle='#ff3030';ctx.fillRect(sx+1,sy-7,(pw-2)*(m.hp/m.maxHp),2);}
}
function drawAnimal(a){
  const sx=Math.floor((a.x-camX)*CFG.TILE),sy=Math.floor((a.y-camY)*CFG.TILE);
  const h=a.small?1.0:1.4; const pw=(a.small?0.5:0.6)*CFG.TILE, ph=h*CFG.TILE,f=a.facing;
  const flash=a.flash>0;
  ctx.save(); ctx.translate(sx+pw/2,sy+ph*0.2); ctx.scale(f,1); const bw=pw*1.1,bh=ph*0.68,ox=-bw/2;
  const c=a.color;
  // 身体
  ctx.fillStyle=flash?'#fff':c;ctx.fillRect(ox+bw*0.2,0+bh*0.25,bw*0.6,bh*0.45);
  // 头
  ctx.fillStyle=flash?'#fff':shadeColor(c,15);
  ctx.fillRect(ox+bw*0.55,0+bh*0.05,bw*0.35,bh*0.25);
  // 眼
  ctx.fillStyle='#000';ctx.fillRect(ox+bw*0.65,0+bh*0.14,2.5,2.5);
  // 腿
  ctx.fillStyle=shadeColor(c,-25);
  ctx.fillRect(ox+bw*0.25,0+bh*0.7,bw*0.15,bh*0.18);ctx.fillRect(ox+bw*0.55,0+bh*0.7,bw*0.15,bh*0.18);
  // 特征
  if(a.type==='cow'){ctx.fillStyle='#fff';ctx.fillRect(ox+bw*0.25,0+bh*0.28,bw*0.5,bh*0.15);ctx.fillStyle='#000';ctx.fillRect(ox+bw*0.2,0+bh*0.15,bw*0.06,bh*0.06);ctx.fillRect(ox+bw*0.7,0+bh*0.15,bw*0.06,bh*0.06);}
  if(a.type==='sheep'){ctx.fillStyle='#fff';ctx.fillRect(ox+bw*0.15,0+bh*0.2,bw*0.7,bh*0.35);ctx.fillStyle=shadeColor(c,20);ctx.fillRect(ox+bw*0.2,0+bh*0.22,bw*0.6,bh*0.3);}
  if(a.type==='pig'){ctx.fillStyle='#ffa0a8';ctx.fillRect(ox+bw*0.82,0+bh*0.16,bw*0.08,bh*0.05);}
  if(a.type==='chicken'){ctx.fillStyle='#e84030';ctx.fillRect(ox+bw*0.6,0+bh*0.0,bw*0.1,bh*0.08);ctx.fillStyle='#f09040';ctx.fillRect(ox+bw*0.82,0+bh*0.08,bw*0.06,bh*0.04);}
  ctx.restore();
  if(a.hp<a.maxHp){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(sx,sy-8,pw,4);ctx.fillStyle='#ff3030';ctx.fillRect(sx+1,sy-7,(pw-2)*(a.hp/a.maxHp),2);}
}
function drawTargetBox(){
  updateTarget(); if(targetBX<0||targetBX>=W||targetBY<0||targetBY>=H)return; if(!canReach(targetBX,targetBY))return;
  const sx=Math.floor((targetBX-camX)*CFG.TILE),sy=Math.floor((targetBY-camY)*CFG.TILE);
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;ctx.strokeRect(sx+1,sy+1,CFG.TILE-2,CFG.TILE-2);
  ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.strokeRect(sx,sy,CFG.TILE,CFG.TILE);
}

// ============================================================ 输入
const keys={}; let mouseDown={left:false,right:false};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!keys[k]){
    if(k>='1'&&k<='9'){selectedSlot=parseInt(k)-1;updateInventoryUI();}
    if(k==='e'||k==='tab'){e.preventDefault(); if(furnaceOpen)closeFurnace(); else if(craftingOpen)toggleCrafting(false); else toggleInventory();}
    if(k==='c'){e.preventDefault(); if(inventoryOpen)toggleInventory(false); else toggleCrafting();}
    if(k==='f')eat();
    if(k==='escape'){ if(inventoryOpen)toggleInventory(false); if(craftingOpen)toggleCrafting(false); if(furnaceOpen)closeFurnace(); }
  }
  keys[k]=true; if(k===' '||k==='tab')e.preventDefault(); ensureAudio();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
canvas.addEventListener('mousemove',e=>{mouseSX=e.clientX;mouseSY=e.clientY;const ch=document.getElementById('crosshair');ch.style.left=e.clientX+'px';ch.style.top=e.clientY+'px';const ci=document.getElementById('cursorItem');ci.style.left=(e.clientX-20)+'px';ci.style.top=(e.clientY-20)+'px';});
canvas.addEventListener('mousedown',e=>{
  ensureAudio();
  if(inventoryOpen||craftingOpen||furnaceOpen||sleeping)return;
  e.preventDefault();
  if(e.button===0){
    const wx=camX+mouseSX/CFG.TILE,wy=camY+mouseSY/CFG.TILE;
    let hit=false;
    for(const m of mobs)if(!m.dead&&wx>m.x-0.3&&wx<m.x+0.9&&wy>m.y&&wy<m.y+1.9){attack();hit=true;break;}
    if(!hit)for(const a of animals)if(!a.dead&&wx>a.x-0.3&&wx<a.x+0.9&&wy>a.y&&wy<a.y+1.9){attack();hit=true;break;}
    if(!hit)mouseDown.left=true;
  }
  if(e.button===2){
    // 右键: 优先使用方块(床/熔炉/工作台)，否则放置
    updateTarget();
    if(canReach(targetBX,targetBY)){ const b=getBlock(targetBX,targetBY); if(b!==0&&useBlock(targetBX,targetBY)) return; }
    mouseDown.right=true; placeBlock();
  }
});
window.addEventListener('mouseup',e=>{if(e.button===0)mouseDown.left=false;if(e.button===2)mouseDown.right=false;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();selectedSlot=(selectedSlot+(e.deltaY>0?1:-1)+9)%9;updateInventoryUI();},{passive:false});
window.addEventListener('resize',resize);
// 熔炉槽点击
['furnIn','furnFuel','furnOut'].forEach(id=>{document.getElementById(id).addEventListener('mousedown',e=>{e.preventDefault();furnaceClick(id==='furnIn'?'in':id==='furnFuel'?'fuel':'out',e.button);});document.getElementById(id).addEventListener('contextmenu',e=>e.preventDefault());});

// ============================================================ 设置系统
let settings={vol:80,particles:10,night:30,dist:14};
function loadSettings(){try{const s=JSON.parse(localStorage.getItem('mc2d_settings'));if(s)Object.assign(settings,s);}catch(e){}}
function saveSettings(){localStorage.setItem('mc2d_settings',JSON.stringify(settings));}
function applySet(){
  settings.vol=parseInt(document.getElementById('sVol').value);
  settings.particles=parseInt(document.getElementById('sPar').value);
  settings.night=parseInt(document.getElementById('sNight').value);
  settings.dist=parseInt(document.getElementById('sDist').value);
  saveSettings();
  // 更新音频池音量
  for(const k in audioPools) for(const a of audioPools[k].list) a.volume=settings.vol/100*0.35;
}
function toggleSettings(){
  const sp=document.getElementById('sp');sp.classList.toggle('open');
  if(sp.classList.contains('open')){
    document.getElementById('sVol').value=settings.vol;document.getElementById('sPar').value=settings.particles;
    document.getElementById('sNight').value=settings.night;document.getElementById('sDist').value=settings.dist;
  }
}
// 手机端触屏
function initMobile(){
  const m=document.getElementById('mobile'); if(!('ontouchstart' in window))return;
  m.style.display='flex';document.getElementById('msetting').style.top='50px';
  const btns={mleft:['a'],mright:['d'],mup:[' '],mdown:['s'],mjump:[' '],mbreak:[],mplace:[]};
  for(const[id,k]of Object.entries(btns)){
    const el=document.getElementById(id);if(!el)continue;
    el.addEventListener('pointerdown',e=>{e.preventDefault();k.forEach(k=>keys[k]=true);if(id==='mbreak')mouseDown.left=true;if(id==='mplace'){mouseDown.right=true;placeBlock();}});
    el.addEventListener('pointerup',e=>{e.preventDefault();k.forEach(k=>keys[k]=false);if(id==='mbreak')mouseDown.left=false;if(id==='mplace')mouseDown.right=false;});
    el.addEventListener('pointerleave',e=>{k.forEach(k=>keys[k]=false);if(id==='mbreak')mouseDown.left=false;if(id==='mplace')mouseDown.right=false;});
  }
  // 双击屏幕攻击
  canvas.addEventListener('dblclick',e=>{e.preventDefault();attack();});
}
// ============================================================ 主循环
let frame=0;
function loop(){
  frame++;
  dayTime=(dayTime+1/CFG.DAY_LEN)%1;
  mobSpawnTimer--; if(dayTime>0.5&&dayTime<0.97&&mobSpawnTimer<=0){spawnMob();mobSpawnTimer=ri(180,360);}
  animalSpawnTimer--; if(dayTime<0.5&&animalSpawnTimer<=0){spawnAnimal();animalSpawnTimer=ri(300,600);}
  updateSleep();
  if(!sleeping){ updatePhysics(); updateBreaking(); }
  updateMobs(); updateAnimals(); updateParticles(); updateDrops(); updateStats(); updateFurnace(); updateWater(); updateToasts();
  if(frame%15===0)updateHUD();
  if(frame%20===0)updateInfo();
  if(mouseDown.right&&!inventoryOpen&&!craftingOpen&&!furnaceOpen&&!sleeping){ if(frame%8===0){updateTarget(); if(canReach(targetBX,targetBY)){const b=getBlock(targetBX,targetBY); if(b===0)placeBlock();}}}
  render(); requestAnimationFrame(loop);
}
function updateInfo(){
  const el=document.getElementById('info'); const t=dayTime;
  const phase=t<0.45?'☀ 白天':t<0.55?'🌆 黄昏':'🌙 夜晚';
  const hh=Math.floor(t*24),mm=Math.floor((t*24%1)*60);
  el.innerHTML=`${phase}<br>时间 ${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}<br>种子 ${worldSeed} · 僵尸 ${mobs.filter(m=>!m.dead).length} · 动物 ${animals.filter(a=>!a.dead).length}`;
}

// ============================================================ 初始化
function init(){
  resize();
  buildHotbar(); buildInventoryUI(); updateHUD();
  document.getElementById('crosshair').style.display='block';
  generateWorld();
  initAudio();
  // 加载Steve角色全身图(mc-heads.net API, CORS支持, 真MC前视图渲染)
  const sImg=new Image();sImg.crossOrigin='anonymous';sImg.onload=()=>{steveTex=sImg;};sImg.src='https://mc-heads.net/body/Steve/60';
  // 先用后备纹理立即启动(防止加载慢)
  for(const id in DEFS) textures[id]={img:null,loaded:false,canvas:null,fallback:makeFallback(parseInt(id))};
  // 预加载水纹理
  textures[34]={img:null,loaded:false,fallback:null};const wImg=new Image();wImg.crossOrigin='anonymous';wImg.onload=()=>{textures[34].img=wImg;textures[34].loaded=true;};wImg.src=TEX_BASE+'blocks/water_still.png';
  // 开始加载网络纹理
  loadAllTextures(()=>{
    updateInventoryUI(); updateCraftingUI(); if(furnaceOpen)updateFurnaceUI();
  });
  // 初始物品
  addToInventory(7,16); addToInventory(4,8); addToInventory(13,1); addToInventory(15,3);
  updateInventoryUI();
  loadSettings(); applySet();
  initMobile();
  // 主菜单按钮事件绑定(修复onclick失效)
  document.querySelectorAll('.menubtn').forEach(b=>{
    if(b.textContent.includes('单人'))b.addEventListener('click',startGame);
    else if(b.textContent.includes('设置'))b.addEventListener('click',toggleSettings);
  });
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('menuSeed').textContent = worldSeed;
  // 游戏不自动开始, 等待主菜单按钮
}
function startGame(){
  document.getElementById('menu').style.display='none';
  loop();
}
}
init();
</script>
